name: Deploy and Test Web App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deploy-test:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: .

      - name: Wait for deployment
        run: |
          echo "Waiting for deployment to be available..."
          for i in {1..30}; do
            curl -s -f $BASE_URL && break || sleep 10
          done

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Selenium and pytest
        run: |
          python -m pip install --upgrade pip
          pip install selenium pytest pytest-html

      - name: Run Selenium E2E tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
        run: |
          pytest automation/web/tests --html=automation/web/reports/selenium_report.html

      - name: Upload Test Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-html-report
          path: automation/web/reports/selenium_report.html

      - name: Publish GitHub Actions Summary
        if: always()
        run: |
          echo "# Live GitHub Pages E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "Deployment URL: $BASE_URL" >> $GITHUB_STEP_SUMMARY
          echo "Test Report: ${{ github.workspace }}/automation/web/reports/selenium_report.html" >> $GITHUB_STEP_SUMMARY
